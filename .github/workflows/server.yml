name: Radar Server Gate
on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - name: Syntax check
        run: python -m py_compile server/app.py
      - name: Container build
        run: docker build -t nexvary-ai-radar-server ./server
